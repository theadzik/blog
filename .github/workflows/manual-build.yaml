name: Manual Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "NODE_ENV to build with"
        required: true
        type: string
        default: "production"
      push:
        description: "Whether to push the image to the registry"
        required: true
        type: boolean
      tags:
        description: "docker/metadata-action tag spec, one per line. Empty uses the action defaults."
        required: false
        type: string

jobs:
  build-and-push:
    uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@069e91f4da064e15e493fc1d88da7d99341345c8 # v3.0.0
    permissions:
      contents: read
      artifact-metadata: write
      packages: write
      attestations: write
      id-token: write
    with:
      registry: ghcr.io
      image-name: ${{ github.repository_owner }}/zmuda-pro-blog
      registry-username: ${{ github.actor }}
      extra-registry: dhi.io
      extra-registry-username: ${{ vars.DOCKERHUB_USERNAME }}
      # Full history is required: the Dockerfile copies .git so Docusaurus can
      # render showLastUpdateTime.
      fetch-depth: 0
      build-args: NODE_ENV=${{ inputs.environment }}
      push: ${{ inputs.push }}
      tags: ${{ inputs.tags }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
