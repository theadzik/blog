name: Build and Push Docker Image
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build for'
        required: true
        type: string
      push:
        description: 'Whether to push the image to the registry'
        required: true
        type: boolean
      tags:
        description: 'Additional tags to apply to the image'
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Environment to build for'
        required: true
        type: string
      push:
        description: 'Whether to push the image to the registry'
        required: true
        type: boolean
      tags:
        description: 'Additional tags to apply to the image'
        required: false
        type: string
env:
  REGISTRY: docker.io
  REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}
  IMAGE_NAME: zmuda-pro-blog

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history is required: the Dockerfile copies .git so Docusaurus can
          # render showLastUpdateTime.
          fetch-depth: 0
          # Without this, checkout writes an x-access-token auth header into
          # .git/config. `COPY . /blog` would bake that token into a builder layer,
          # and `cache-to: type=gha,mode=max` would then export it to the Actions
          # cache, where it outlives the job. Nothing here pushes via git.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Every stage of the Dockerfile is based on dhi.io, which issues no
      # anonymous pull tokens. Same Docker account as above.
      - name: Login to dhi.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: dhi.io
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      # Built locally first so it can be scanned before anything is published.
      # Nothing consults GitHub check status at deploy time - ArgoCD Image Updater
      # watches the registry directly - so a scan that ran after the push could not
      # stop a vulnerable image from being deployed.
      - name: Build image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: "linux/amd64"
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The local `docker` exporter rejects attestations; they are produced by
          # the push step below instead.
          provenance: false
          sbom: false
          build-args: |
            NODE_ENV=${{ inputs.environment }}

      # ignore-unfixed: an unfixable finding in a base image cannot be actioned
      # here, and would block every release until upstream published a patch.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Layers are already in the cache, so this re-exports rather than rebuilds.
      - name: Push image
        id: build-push
        if: ${{ inputs.push }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: "linux/amd64"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
          build-args: |
            NODE_ENV=${{ inputs.environment }}

      - name: Extract buildx-generated SBOM
        if: ${{ inputs.push }}
        id: sbom-extract
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }} \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        if: ${{ inputs.push }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest Provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        if: ${{ inputs.push }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
