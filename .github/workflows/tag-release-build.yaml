name: Tag Release Build

on:
  push:
    tags:
      # CalVer only (2026.7.5)
      - "[0-9][0-9][0-9][0-9].[0-9]+.[0-9]+"

jobs:
  build-and-push:
    uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@e3bd92f193c1814d832db2d32d5c7027a949df00 # v2.1.0-rc.5
    permissions:
      contents: read
      artifact-metadata: write
      packages: write
      attestations: write
      id-token: write
    with:
      registry: ghcr.io
      image-name: ${{ github.repository_owner }}/zmuda-pro-blog
      registry-username: ${{ github.actor }}
      extra-registry: dhi.io
      extra-registry-username: ${{ vars.DOCKERHUB_USERNAME }}
      # Full history is required: the Dockerfile copies .git so Docusaurus can
      # render showLastUpdateTime.
      fetch-depth: 0
      build-args: NODE_ENV=production
      push: true
      tags: |
        type=ref,event=tag
        type=raw,value=latest
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
