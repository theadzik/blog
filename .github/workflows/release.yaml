name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: zmuda-pro/package.json

      - name: Compute next calendar version
        id: version
        run: |
          YEAR=$(date +'%Y')
          MONTH=$(date +'%-m')   # no leading zero
          PREFIX="${YEAR}.${MONTH}."

          # Find existing tags matching this year.month.*, extract the highest xx
          LATEST=$(git tag -l "${PREFIX}*" | sed "s/^${PREFIX}//" | sort -n | tail -1)

          if [ -z "$LATEST" ]; then
            NEXT=1
          else
            NEXT=$((LATEST + 1))
          fi

          VERSION="${YEAR}.${MONTH}.${NEXT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "${{ vars.APP_CLIENT_ID }}+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Bump package.json version
        working-directory: zmuda-pro
        run: pnpm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Commit version bump
        run: |
          git add zmuda-pro/package.json zmuda-pro/pnpm-lock.yaml
          git commit -m "chore(release): ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
