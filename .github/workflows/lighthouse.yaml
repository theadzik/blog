name: Lighthouse Report - zmuda.pro
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  lighthouse-report:
    name: Lighthouse Report
    runs-on: ubuntu-latest
    env:
      URL_DOMAIN: zmuda.pro
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate URLs
        id: urls
        shell: bash
        run: |
          urls=""
          shopt -s nullglob
          for file in zmuda-pro/blog/*.md zmuda-pro/blog/**/index.md; do
            slug=$(sed -nE 's/^slug:[[:space:]]*"?([^"#]+)"?.*$/\1/p' "$file" | head -n1 | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            if [[ -n "$slug" ]]; then
              urls+="https://${{ env.URL_DOMAIN }}/$slug?docusaurus-theme=light"$'\n'
              urls+="https://${{ env.URL_DOMAIN }}/$slug?docusaurus-theme=dark"$'\n'
            fi
          done
          urls=$(printf "%s" "$urls" | awk 'NF && !seen[$0]++')
          echo "urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$urls" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Audit URLs using Lighthouse
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            https://${{ env.URL_DOMAIN }}?docusaurus-theme=light
            https://${{ env.URL_DOMAIN }}/aboutme?docusaurus-theme=light
            https://${{ env.URL_DOMAIN }}?docusaurus-theme=dark
            https://${{ env.URL_DOMAIN }}/aboutme?docusaurus-theme=dark
            ${{ steps.urls.outputs.urls }}
          configPath: ./.github/workflows/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Format lighthouse score
        id: format_lighthouse_score
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # 9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = ${{ steps.lighthouse_audit.outputs.manifest }}
            const links = ${{ steps.lighthouse_audit.outputs.links }}
            const createLighthouseReport = (await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/formatLighthouseReport.js`)).default;
            const comment = createLighthouseReport({ results, links });
            core.setOutput("comment", comment);

      - name: Add Lighthouse stats to summary
        run: |
          echo "${{ steps.format_lighthouse_score.outputs.comment }}" >> "$GITHUB_STEP_SUMMARY"
