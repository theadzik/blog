name: Build

# One workflow for every automatic build: pushes to main, CalVer release tags,
# and pull requests. What differs between them is which tags get published and
# whether the image is pushed at all, both of which are expressed below rather
# than duplicated across three files.
on:
  push:
    branches:
      - "main"
    tags:
      # CalVer only (2026.7.5). "*" meant any tag - a scratch marker or a backup
      # ref - triggered a production build.
      - "[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*"
    # Only rebuild when something that changes the rendered site changes.
    # Ignored for tag pushes, which always build - verified against this
    # repository rather than assumed, since the documentation does not say so.
    paths:
      - "zmuda-pro/**"
      - "Dockerfile"
      - "default.conf"
      - ".dockerignore"
  pull_request:
    branches:
      - "main"
    # Same set, plus the audit thresholds. Workflow files are deliberately
    # absent so that Dependabot action bumps do not trigger a build and audit.
    paths:
      - "zmuda-pro/**"
      - "Dockerfile"
      - "default.conf"
      - ".dockerignore"
      - ".github/workflows/lighthouserc.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded pull request builds are worth cancelling; pushes are not. Every
  # commit on main should produce its own immutable sha- image, so the dev
  # environment keeps a traceable audit trail.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: Build and push image
    uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@e3bd92f193c1814d832db2d32d5c7027a949df00 # v2.1.0-rc.5
    permissions:
      contents: read
      artifact-metadata: write
      packages: write
      attestations: write
      id-token: write
    with:
      registry: ghcr.io
      image-name: ${{ github.repository_owner }}/zmuda-pro-blog
      registry-username: ${{ github.actor }}
      extra-registry: dhi.io
      extra-registry-username: ${{ vars.DOCKERHUB_USERNAME }}
      # Full history is required: the Dockerfile copies .git so Docusaurus can
      # render showLastUpdateTime.
      fetch-depth: 0
      # Must match what ships. Lighthouse auditing a development bundle would be
      # measuring an artifact that never reaches production.
      build-args: NODE_ENV=production
      # Dependabot PRs run with a read-only GITHUB_TOKEN, so they can build but
      # not publish or attest.
      push: ${{ github.event_name != 'pull_request' || github.actor != 'dependabot[bot]' }}
      # Each line applies only to the event that makes it meaningful, so one
      # spec covers all three:
      #   main   -> main, sha-<commit>
      #   tag    -> 2026.7.5, latest
      #   PR     -> pr-<number>
      # sha- is what the dev environment tracks. It has to be immutable and
      # distinct per commit: ArgoCD Image Updater writes the tag into git, so a
      # mutable tag like "main" would write an unchanged value and ArgoCD would
      # never re-sync. "main" is published alongside it purely as a convenience
      # pointer for humans.
      #
      # The CalVer tag is what the prod environment tracks
      # (allowTags: ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ in the homelab
      # ImageUpdater). "latest" is published alongside it as a human pointer.
      tags: |
        type=raw,value=main,enable={{is_default_branch}}
        type=sha,enable={{is_default_branch}}
        type=ref,event=tag
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
        type=ref,event=pr
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

  lighthouse-report:
    name: Lighthouse Report (PR image)
    needs: build-and-push
    # Pull requests only, and not Dependabot's: the service container below
    # pulls the pr-<n> tag, which a Dependabot PR never pushes. Without this the
    # job fails before any step runs, trying to pull an image that was never
    # built.
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # actions/checkout below
      pull-requests: write # for marocchino/sticky-pull-request-comment
      packages: read # the service container below pulls from ghcr.io
    env:
      URL_DOMAIN: localhost:8080
      REGISTRY: ghcr.io
      IMAGE_NAME: zmuda-pro-blog
    services:
      web:
        image: ghcr.io/${{ github.repository_owner }}/zmuda-pro-blog:pr-${{ github.event.pull_request.number }}
        # A newly created ghcr.io package is private until published, and a
        # service container is pulled before any step runs, so it cannot rely on
        # a login step.
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports:
          - 8080:8080
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate URLs
        id: urls
        shell: bash
        run: |
          urls=""
          shopt -s nullglob
          for file in zmuda-pro/blog/*.md zmuda-pro/blog/**/index.md; do
            slug=$(sed -nE 's/^slug:[[:space:]]*"?([^"#]+)"?.*$/\1/p' "$file" | head -n1 | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            if [[ -n "$slug" ]]; then
              urls+="http://${{ env.URL_DOMAIN }}/$slug?docusaurus-theme=light"$'\n'
              urls+="http://${{ env.URL_DOMAIN }}/$slug?docusaurus-theme=dark"$'\n'
            fi
          done
          urls=$(printf "%s" "$urls" | awk 'NF && !seen[$0]++')
          echo "urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$urls" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Audit URLs using Lighthouse
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            http://${{ env.URL_DOMAIN }}?docusaurus-theme=light
            http://${{ env.URL_DOMAIN }}/aboutme?docusaurus-theme=light
            http://${{ env.URL_DOMAIN }}?docusaurus-theme=dark
            http://${{ env.URL_DOMAIN }}/aboutme?docusaurus-theme=dark
            ${{ steps.urls.outputs.urls }}
          configPath: ./.github/workflows/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Format lighthouse score
        id: format_lighthouse_score
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # 9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = ${{ steps.lighthouse_audit.outputs.manifest }}
            const links = ${{ steps.lighthouse_audit.outputs.links }}
            const createLighthouseReport = (await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/formatLighthouseReport.js`)).default;
            const comment = createLighthouseReport({ results, links });
            core.setOutput("comment", comment);

      - name: Add Lighthouse stats as comment
        id: comment_to_pr
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # 3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number }}
          header: lighthouse
          message: ${{ steps.format_lighthouse_score.outputs.comment }}
