name: PR Quality Checks
on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: zmuda-pro/package.json

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: latest
          cache: 'pnpm'
          cache-dependency-path: zmuda-pro/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: zmuda-pro
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        working-directory: zmuda-pro
        run: |
          pnpm audit --audit-level=high
        continue-on-error: true

      - name: Check for outdated packages
        working-directory: zmuda-pro
        continue-on-error: true
        run: pnpm outdated

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only meaningful for a pull request: the action diffs the manifests between
    # base and head.
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write # to post the review summary comment
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependabot is reactive - it alerts on advisories affecting what is already
      # merged. This blocks a PR that would introduce a new vulnerable dependency
      # in the first place.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Matched to the pnpm audit bar above.
          fail-on-severity: high
          # The same two advisories accepted in zmuda-pro/pnpm-workspace.yaml.
          # Needed here as well: a Docusaurus bump reshuffles the transitive tree,
          # and this action would otherwise report them as newly introduced and
          # block Dependabot. Keep the two lists in step.
          allow-ghsas: GHSA-5c6j-r48x-rmvq, GHSA-mh99-v99m-4gvg
          comment-summary-in-pr: on-failure

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
