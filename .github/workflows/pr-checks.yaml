name: PR Quality Checks
on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: zmuda-pro/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: latest
          cache: 'pnpm'
          cache-dependency-path: zmuda-pro/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: zmuda-pro
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        working-directory: zmuda-pro
        run: |
          if ! pnpm audit --audit-level=moderate; then
            echo "::warning title=pnpm audit::Security audit reported moderate or higher vulnerabilities"
          fi

      - name: Check for outdated packages
        working-directory: zmuda-pro
        run: pnpm outdated

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  docker-build-test:
    name: Docker Build Push PR image
    permissions:
      contents: read
      artifact-metadata: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      environment: 'development'
      # Dependabot PRs run with a read-only GITHUB_TOKEN, so they can build but
      # not publish or attest. Own PRs keep pushing the pr-<n> tag as before.
      push: ${{ github.actor != 'dependabot[bot]' }}
      tags: pr-${{ github.event.pull_request.number }}
    secrets: inherit

  lighthouse-report:
    name: Lighthouse Report
    needs: docker-build-test
    # The service container below pulls the pr-<n> tag, which a Dependabot PR
    # never pushes. Without this the job fails before any step runs.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # for marocchino/sticky-pull-request-comment
    env:
      URL_DOMAIN: localhost:8080
      REGISTRY: docker.io
      REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_NAME: zmuda-pro-blog
    services:
      web:
        image: docker.io/theadzik/zmuda-pro-blog:pr-${{ github.event.pull_request.number }}
        ports:
          - 8080:8080
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate URLs
        id: urls
        shell: bash
        run: |
          urls=""
          shopt -s nullglob
          for file in zmuda-pro/blog/*.md zmuda-pro/blog/**/index.md; do
            slug=$(sed -nE 's/^slug:[[:space:]]*"?([^"#]+)"?.*$/\1/p' "$file" | head -n1 | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
            if [[ -n "$slug" ]]; then
              urls+="http://${{ env.URL_DOMAIN }}/$slug?docusaurus-theme=light"$'\n'
              urls+="http://${{ env.URL_DOMAIN }}/$slug?docusaurus-theme=dark"$'\n'
            fi
          done
          urls=$(printf "%s" "$urls" | awk 'NF && !seen[$0]++')
          echo "urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$urls" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Audit URLs using Lighthouse
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            http://${{ env.URL_DOMAIN }}?docusaurus-theme=light
            http://${{ env.URL_DOMAIN }}/aboutme?docusaurus-theme=light
            http://${{ env.URL_DOMAIN }}?docusaurus-theme=dark
            http://${{ env.URL_DOMAIN }}/aboutme?docusaurus-theme=dark
            ${{ steps.urls.outputs.urls }}
          configPath: ./.github/workflows/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: true

      - name: Format lighthouse score
        id: format_lighthouse_score
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # 9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const results = ${{ steps.lighthouse_audit.outputs.manifest }}
            const links = ${{ steps.lighthouse_audit.outputs.links }}
            const createLighthouseReport = (await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/formatLighthouseReport.js`)).default;
            const comment = createLighthouseReport({ results, links });
            core.setOutput("comment", comment);

      - name: Add Lighthouse stats as comment
        id: comment_to_pr
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # 3.0.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number }}
          header: lighthouse
          message: ${{ steps.format_lighthouse_score.outputs.comment }}
