name: Main Build

on:
  push:
    branches:
      - "main"
    # Same set as website-checks.yaml: only rebuild when something that changes
    # the rendered site changes.
    paths:
      - "zmuda-pro/**"
      - "Dockerfile"
      - "default.conf"
      - ".dockerignore"

concurrency:
  group: ${{ github.workflow }}
  # Not cancel-in-progress: every commit on main should produce its own
  # immutable sha- image, so the dev environment has a traceable audit trail.
  cancel-in-progress: false

jobs:
  build-and-push:
    uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@a68501109de1ebe28c9192364f88b8bfadbf5b79 # v2.1.0-rc.3
    permissions:
      contents: read
      artifact-metadata: write
      packages: write
      attestations: write
      id-token: write
    with:
      registry: ghcr.io
      image-name: ${{ github.repository_owner }}/zmuda-pro-blog
      registry-username: ${{ github.actor }}
      extra-registry: dhi.io
      extra-registry-username: ${{ vars.DOCKERHUB_USERNAME }}
      # Full history is required: the Dockerfile copies .git so Docusaurus can
      # render showLastUpdateTime.
      fetch-depth: 0
      build-args: NODE_ENV=production
      push: true
      # sha- is what the dev environment tracks. It has to be immutable and
      # distinct per commit: ArgoCD Image Updater writes the tag into git, so a
      # mutable tag like "main" would write an unchanged value and ArgoCD would
      # never re-sync. "main" is published alongside it purely as a convenience
      # pointer for humans.
      tags: |
        type=raw,value=main
        type=sha
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
