# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        exclude: "package.*.json"
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--no-ensure-ascii"
        exclude: "package.*.json"
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--fix"]
        exclude: ".github/copilot-instructions.md"
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker
  # GitHub secret scanning with push protection is already enabled, but that is
  # server-side and only fires once a commit is on its way out. This catches a
  # secret locally, before it exists in history at all.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - ".sec.baseline"
        exclude: "pnpm-lock.yaml"
